plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.version
group = project.group

loom {
    splitEnvironmentSourceSets()
    mods {
        "taczclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

sourceSets {
    rendererTest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
    }
}

tasks.register('rendererRegressionTest', JavaExec) {
    dependsOn tasks.named('rendererTestClasses')
    classpath = sourceSets.rendererTest.runtimeClasspath
    mainClass = 'com.tacz.client.render.RendererRegressionTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (providers.gradleProperty('testPack').isPresent()) {
        args providers.gradleProperty('testPack').get()
    }
}
tasks.named('check') { dependsOn tasks.named('rendererRegressionTest') }

def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyAssetFreeJar') {
    dependsOn tasks.named('jar')
    inputs.file(releaseJar)
    doLast {
        new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { archive ->
            def unwanted = archive.entries().findAll { entry ->
                entry.name.matches('assets/[^/]+/(animations|geo_models|textures|sounds|scripts|display|config)/.*') ||
                    entry.name.startsWith('data/') || entry.name.startsWith('resourcepacks/') ||
                    entry.name.startsWith('examples/')
            }
            if (!unwanted.isEmpty()) throw new GradleException("Unexpected bundled assets: ${unwanted*.name}")
        }
        logger.lifecycle('PASS: release JAR contains no animation/model packs or item mappings')
    }
}
tasks.named('check') { dependsOn tasks.named('verifyAssetFreeJar') }

jar {
    def baseName = project.property("archives_base_name")
    archiveBaseName.set(baseName)
    from("LICENSE") {
        rename { "${it}_${baseName}" }
    }
    from('NOTICE.md')
}
